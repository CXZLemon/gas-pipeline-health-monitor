[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-pipeline-health-monitor"
version = "0.1.0"
description = "Beginner-friendly gas pipeline telemetry anomaly detection and dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xiaozheng Chen"}]
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "scikit-learn>=1.4,<2.0",
    "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.32,<2.0", "plotly>=5.20,<7.0", "PyMySQL>=1.1,<2.0"]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

